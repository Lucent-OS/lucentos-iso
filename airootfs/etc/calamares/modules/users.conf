---
defaultGroups: [ wheel, audio, video, storage, network ]
autologinGroup: ""
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
displayAutologin: false
doAutologin: false
allowWeakPasswords: false
user:
  shell: /usr/bin/zsh
  forbidden_names: [ root, nobody, lucent ]
  home_permissions: "o750"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-lucent"

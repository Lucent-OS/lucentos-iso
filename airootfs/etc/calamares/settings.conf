---
modules-search: [ /etc/calamares/modules, local ]
branding: lucent
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
instances:
  - { module: lucent, id: validate, config: lucent-validate.conf }
  - { module: lucent, id: cleanup, config: lucent-cleanup.conf }
  - { module: lucent, id: boot, config: lucent-boot.conf }
sequence:
  - show: [ welcome, locale, keyboard, partition, users, summary ]
  - exec:
      - partition
      - mount
      - lucent@validate
      - unpackfs
      - lucent@cleanup
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - users
      - hwclock
      - initcpio
      - lucent@boot
      - umount
  - show: [ finished ]

timeout: 15
default_entry: 1
serial: yes

/Lucent install medium (%ARCH%, ${FW_TYPE})
    protocol: linux
    path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto

/Lucent install medium with speakup screen reader (%ARCH%, ${FW_TYPE})
    protocol: linux
    path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

/Run Memtest86+ (BIOS)
    if_fw_type: BIOS
    protocol: linux
    path: boot():/boot/memtest86+/memtest.bin

/Run Memtest86+ (UEFI)
    protocol: efi
    path: boot():/boot/memtest86+/memtest.efi

/UEFI Shell
    protocol: efi
    path: boot():/shellx64.efi

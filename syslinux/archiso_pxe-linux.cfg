LABEL lucent_nbd
TEXT HELP
Boot the Lucent install medium using NBD.
It allows you to install Lucent or perform system maintenance.
ENDTEXT
MENU LABEL Lucent install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

LABEL lucent_nfs
TEXT HELP
Boot the Lucent live medium using NFS.
It allows you to install Lucent or perform system maintenance.
ENDTEXT
MENU LABEL Lucent install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y
SYSAPPEND 3

LABEL lucent_http
TEXT HELP
Boot the Lucent live medium using HTTP.
It allows you to install Lucent or perform system maintenance.
ENDTEXT
MENU LABEL Lucent install medium (%ARCH%, HTTP)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux

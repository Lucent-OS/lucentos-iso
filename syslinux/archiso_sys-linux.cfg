LABEL arch
TEXT HELP
Boot the Lucent install medium on BIOS.
It allows you to install Lucent or perform system maintenance.
ENDTEXT
MENU LABEL Lucent install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Lucent install medium on BIOS with speakup screen reader.
It allows you to install Lucent or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Lucent install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on